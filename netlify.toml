# Netlify deployment configuration for Dialed Dawg.
# Explicit build settings — never rely on framework auto-detection.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires Node >= 20.19; pin so local and CI builds match.
  NODE_VERSION = "22"

# SPA fallback. Routing is hash-based so every page URL is "/", but this
# guarantees a deep link or stray path never surfaces a Netlify 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets are immutable — cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker, its registration stub, the manifest, and the HTML
# shell must always revalidate so clients pick up new deploys promptly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
